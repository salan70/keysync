# R-006 Spike の `desired.mjs` と同じ desired state。
# 位置は Karabiner の key_code 名で、値は QMK 表記（ADR 0022）。matrix の row / col は無い。
# 書かれていないキーは素通しなので、全キーを並べる必要がない。
# layout は対象の物理配列。かな / 英数を使うので JIS 前提（ADR 0024）。
# devices はこの設定を適用するデバイス。省略時は内蔵キーボードだけ（ADR 0026）。
schema: keysync/mac-keymap@1
layout: jis
devices:
  - { built_in: true }
profile: "KeySync"
layers:
  0:
    "caps_lock": "LCTL_T(KC_ESC)"
    "japanese_eisuu": "MO(2)"
    "japanese_kana": "LT1(KC_LANG1)"
    "right_command": "MO(3)"
  1:
    "a": "KC_HOME"
    "d": "KC_DEL"
    "e": "KC_END"
    "h": "KC_LEFT"
    "j": "KC_DOWN"
    "k": "KC_UP"
    "l": "KC_RGHT"
  2:
    "1": "KC_F1"
    "2": "KC_F2"
    "caps_lock": "LCTL_T(KC_ESC)"
    "q": "KC_NO"
    "w": "KC_TRNS"
  3:
    "i": "KC_8"
    "o": "KC_9"
    "u": "KC_7"
