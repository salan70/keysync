# KeySync が linux-keyboard.jis.yaml から生成した keyd の設定。直接編集しない。

[ids]

k:05ac:027e

[main]

capslock = overload(control, esc)
hanja = layer(layer2)
hangeul = overload(layer1, hangeul)
rightmeta = toggle(layer3)

[layer1]

a = home
d = delete
e = end
h = left
j = down
k = up
l = right

[layer2]

1 = f1
2 = f2
q = noop

[layer3]

i = 8
o = 9
u = 7
